<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#192338" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A79AFB" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#2B3650" stroke-width="2" />

  <!-- Outer Shield Outline with subtle glow -->
  <path d="M256 80 L390 140 C390 280 256 390 256 420 C256 390 122 280 122 140 Z"
        fill="rgba(139, 124, 246, 0.08)"
        stroke="url(#shieldGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Vault Lock Symbol -->
  <!-- Shackle -->
  <path d="M206 230 V195 C206 167 228 145 256 145 C284 145 306 167 306 195 V230"
        fill="none"
        stroke="#F8FAFC"
        stroke-width="14"
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="186" y="230" width="140" height="110" rx="24"
        fill="url(#shieldGrad)"
        stroke="#F8FAFC"
        stroke-width="6" />

  <!-- Keyhole -->
  <circle cx="256" cy="275" r="10" fill="#0B1020" />
  <path d="M252 280 L248 310 H264 L260 280 Z" fill="#0B1020" />
</svg>

